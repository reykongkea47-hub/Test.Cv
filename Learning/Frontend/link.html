<!DOCTYPE html>
<html lang="en">

<head>
    <!-- head ប្រើសម្រាប់ដាក់ព័ត៌មានរបស់ Web Page -->
    <title>HTML Links and Media</title>
</head>

<body>

    <!-- a ប្រើសម្រាប់បង្កើត Link ទៅកាន់ Page ឬ Website ផ្សេង -->
    <a href="https://www.google.com">
        ចូលទៅ Google
    </a>

    <br><br>


    <!-- img ប្រើសម្រាប់បង្ហាញរូបភាព -->
    <!-- src គឺជាទីតាំងរបស់រូបភាព -->
    <!-- alt ប្រើសម្រាប់ពិពណ៌នារូបភាព -->
    <img
        src="image.jpg"
        alt="រូបភាពគំរូ"
        width="300"
    >

    <br><br>


    <!-- audio ប្រើសម្រាប់បញ្ចូល Audio -->
    <!-- controls បង្ហាញប៊ូតុង Play, Pause និង Volume -->
    <audio controls>

        <!-- source ប្រើសម្រាប់កំណត់ទីតាំង File Audio -->
        <source src="music.mp3" type="audio/mpeg">

        <!-- អត្ថបទនេះបង្ហាញ ប្រសិនបើ Browser មិន Support Audio -->
        Browser របស់អ្នកមិន Support Audio ទេ។

    </audio>

    <br><br>


    <!-- video ប្រើសម្រាប់បញ្ចូល Video -->
    <!-- controls បង្ហាញប៊ូតុង Play, Pause និង Volume -->
    <video
        width="500"
        controls
    >

        <!-- source កំណត់ទីតាំង File Video -->
        <source src="video.mp4" type="video/mp4">

        <!-- អត្ថបទនេះបង្ហាញ ប្រសិនបើ Browser មិន Support Video -->
        Browser របស់អ្នកមិន Support Video ទេ។

    </video>

    <br><br>


    <!-- track ប្រើសម្រាប់បន្ថែម Subtitle ឬ Caption ទៅក្នុង Video -->
    <video
        width="500"
        controls
    >

        <!-- source គឺជា Video File -->
        <source src="video.mp4" type="video/mp4">

        <!--
            track ប្រើសម្រាប់បង្ហាញ Subtitle
            kind="subtitles" មានន័យថា Subtitle
            srclang="en" មានន័យថា English
        -->
        <track
            src="subtitles.vtt"
            kind="subtitles"
            srclang="en"
            label="English"
        >

    </video>

    <br><br>


    <!-- iframe ប្រើសម្រាប់បញ្ចូល Website ឬ Content ពី Website ផ្សេង -->
    <iframe
        src="https://www.example.com"
        width="600"
        height="400"
        title="Example Website"
    >
    </iframe>

    <br><br>


    <!-- picture ប្រើសម្រាប់បង្ហាញរូបភាពខុសៗគ្នាតាម Screen Size -->
    <picture>

        <!--
            source អាចកំណត់រូបភាពសម្រាប់ Screen ធំ
            media ប្រើសម្រាប់កំណត់លក្ខខណ្ឌ Screen
        -->
        <source
            media="(min-width: 800px)"
            srcset="large.jpg"
        >

        <!--
            img គឺជា Default Image
            ប្រសិនបើ source ខាងលើមិនត្រូវនឹងលក្ខខណ្ឌ
        -->
        <img
            src="small.jpg"
            alt="រូបភាព Responsive"
            width="300"
        >

    </picture>


</body>

</html>
