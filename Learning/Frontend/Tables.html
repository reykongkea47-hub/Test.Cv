<!DOCTYPE html>
<html lang="en">

<head>
    <!-- head ប្រើសម្រាប់ដាក់ព័ត៌មានរបស់ Web Page -->
    <title>HTML Tables</title>
</head>

<body>

    <!-- table ប្រើសម្រាប់បង្កើតតារាង -->
    <table border="1">

        <!-- caption ប្រើសម្រាប់ដាក់ចំណងជើងឱ្យតារាង -->
        <caption>Student Information</caption>

        <!-- colgroup ប្រើសម្រាប់កំណត់ក្រុម Column -->
        <colgroup>

            <!-- col ប្រើសម្រាប់កំណត់ Style ឬលក្ខណៈរបស់ Column -->
            <col style="background-color: lightgray;">

        </colgroup>

        <!-- thead ប្រើសម្រាប់ដាក់ផ្នែក Header របស់តារាង -->
        <thead>

            <!-- tr ប្រើសម្រាប់បង្កើត Row -->
            <tr>

                <!-- th ប្រើសម្រាប់បង្កើត Header Cell -->
                <th>ID</th>

                <!-- th ប្រើសម្រាប់បង្កើត Header Cell -->
                <th>Name</th>

                <!-- th ប្រើសម្រាប់បង្កើត Header Cell -->
                <th>Course</th>

            </tr>

        </thead>
        <tbody>

            <!-- tr បង្កើត Row ទី 1 -->
            <tr>

                <!-- td ប្រើសម្រាប់ដាក់ Data ក្នុង Cell -->
                <td>1</td>

                <td>Kongkea</td>

                <td>Computer Science</td>

            </tr>

            <!-- tr បង្កើត Row ទី 2 -->
            <tr>

                <td>2</td>

                <td>Dara</td>

                <td>Information Technology</td>

            </tr>

            <!-- tr បង្កើត Row ទី 3 -->
            <tr>

                <td>3</td>

                <td>Sokha</td>

                <td>Computer Science</td>

            </tr>

        </tbody>

        <!-- tfoot ប្រើសម្រាប់ដាក់ផ្នែក Footer របស់តារាង -->
        <tfoot>

            <!-- tr បង្កើត Footer Row -->
            <tr>

                <!-- td ប្រើសម្រាប់ដាក់ Data ក្នុង Footer -->
                <td colspan="2">Total Students</td>

                <td>3</td>

            </tr>

        </tfoot>

    </table>

</body>

</html>
