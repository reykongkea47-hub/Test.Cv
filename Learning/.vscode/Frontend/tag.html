<!DOCTYPE html>
<html lang="en">

<head>
    <!-- head គឺជាផ្នែកសម្រាប់ដាក់ព័ត៌មានអំពី Website -->
    
    <!-- title គឺជាឈ្មោះដែលបង្ហាញនៅលើ Browser Tab -->
    <title>HTML Basic Tags</title>
</head>

<body>

    <!-- body គឺជាផ្នែកដែលផ្ទុក Content ដែលអ្នកប្រើអាចមើលឃើញ -->

    <!-- br ប្រើសម្រាប់ចុះបន្ទាត់ថ្មី -->
    <p>
        សួស្តី<br>
        ខ្ញុំកំពុងរៀន HTML<br>
        ខ្ញុំចង់ក្លាយជា Web Developer
    </p>
    <!-- hr ប្រើសម្រាប់បង្កើតបន្ទាត់ផ្ដេក -->
    <hr>
    <!-- a ប្រើសម្រាប់បង្កើត Link ទៅកាន់ Website ផ្សេង -->
    <!-- href ប្រើសម្រាប់កំណត់ទីតាំងរបស់ Link -->
    <a href="https://www.google.com">
        ចូលទៅ Google
    </a>


    <!-- img ប្រើសម្រាប់បង្ហាញរូបភាព -->
    <!-- src ប្រើសម្រាប់កំណត់ទីតាំងរូបភាព -->
    <!-- alt ប្រើសម្រាប់ពិពណ៌នារូបភាព -->
    <br><br>

    <img
        src="https://via.placeholder.com/300"
        alt="រូបភាពគំរូ"
        width="300"
    >


    <!-- div ប្រើសម្រាប់បង្កើត Container ដើម្បីដាក់ Elements ជាក្រុម -->
    <div>

        <!-- h2 ប្រើសម្រាប់បង្កើតចំណងជើង -->
        <h2>ព័ត៌មានរបស់ខ្ញុំ</h2>

        <!-- p ប្រើសម្រាប់បង្ហាញអត្ថបទ -->
        <p>
            ខ្ញុំកំពុងរៀន Web Development។
        </p>

    </div>


    <!-- span ប្រើសម្រាប់ដាក់ ឬ Style ផ្នែកតូចមួយនៃអត្ថបទ -->
    <!-- span ជា Inline Element -->
    <p>
        ភាសាដែលខ្ញុំចូលចិត្តគឺ
        <span>Python</span>
    </p>


</body>

</html>
